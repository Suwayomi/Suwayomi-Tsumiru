# CI supplies the new-ID Linux bundle in bundle-new.
app-id: app.tsumiru.Tsumiru
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: tsumiru

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets

modules:
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz
        sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e

  - name: tsumiru
    buildsystem: simple
    build-commands:
      - mkdir -p /app/tsumiru
      - cp -r bundle-new/* /app/tsumiru/
      - chmod +x /app/tsumiru/tsumiru
      - mkdir -p /app/bin
      - ln -s /app/tsumiru/tsumiru /app/bin/tsumiru
      - install -Dm644 app.tsumiru.Tsumiru.desktop /app/share/applications/app.tsumiru.Tsumiru.desktop
      - install -Dm644 app.tsumiru.Tsumiru.metainfo.xml /app/share/metainfo/app.tsumiru.Tsumiru.metainfo.xml
      - install -Dm644 app.tsumiru.Tsumiru.png /app/share/icons/hicolor/512x512/apps/app.tsumiru.Tsumiru.png
    sources:
      - type: dir
        path: .

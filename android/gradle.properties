org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m
# Independent modules/tasks run concurrently, and outputs are cached and
# reused across the 3 --split-per-abi variants, which otherwise redo most of
# the same Kotlin/Java compilation and resource processing three times.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 compiles Kotlin itself, so no plugin applies org.jetbrains.kotlin.android.
android.builtInKotlin=true
# Stays false while plugins still use the legacy DSL: android_file_picker
# (file_picker) fails with "Extension of type 'LibraryExtension' does not exist".
android.newDsl=false

fragment OpdsSettingsDto on SettingsType {
  opdsUseBinaryFileSizes
  opdsItemsPerPage
  opdsEnablePageReadProgress
  opdsMarkAsReadOnDownload
  opdsShowOnlyUnreadChapters
  opdsShowOnlyDownloadedChapters
  opdsSkipChapterMetadataFeed
  opdsChapterSortOrder
  opdsCbzMimetype
}

query OpdsLegacySettings {
  settings {
    ...OpdsSettingsDto
  }
}

mutation UpdateOpdsUseBinaryFileSizes($opdsUseBinaryFileSizes: Boolean!) {
  setSettings(
    input: { settings: { opdsUseBinaryFileSizes: $opdsUseBinaryFileSizes } }
  ) {
    settings {
      ...OpdsSettingsDto
    }
  }
}

mutation UpdateOpdsItemsPerPage($opdsItemsPerPage: Int!) {
  setSettings(input: { settings: { opdsItemsPerPage: $opdsItemsPerPage } }) {
    settings {
      ...OpdsSettingsDto
    }
  }
}

mutation UpdateOpdsEnablePageReadProgress(
  $opdsEnablePageReadProgress: Boolean!

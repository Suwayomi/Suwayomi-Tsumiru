mutation UpdateOpdsCbzMimetype($opdsCbzMimetype: CbzMediaType!) {
  setSettings(input: { settings: { opdsCbzMimetype: $opdsCbzMimetype } }) {
    settings {
      ...OpdsSettingsDto
    }
  }
}

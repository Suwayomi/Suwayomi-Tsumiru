# A history row shows the series' title, cover, author, unread count and
# library membership. The full MangaBaseDto (description, meta, genres, URLs…)
# repeated for each of up to 2000 chapters made one fetch ~3.8 MB and ~7 s on a
# 360-series library.
fragment HistoryChapterDto on ChapterType {
  ...ChapterDto
  manga {
    id
    title
    thumbnailUrl
    author
    inLibrary
    unreadCount
  }
}

query GetReadingHistory(
  $first: Int,
  $offset: Int,
  $after: Cursor,
  $before: Cursor,
  $filter: ChapterFilterInput,
  $order: [ChapterOrderInput!]
) {
  chapters(
    first: $first
    offset: $offset
    after: $after
    before: $before
    filter: $filter
    order: $order
  ) {
    nodes {
      ...HistoryChapterDto
    }
  }
}

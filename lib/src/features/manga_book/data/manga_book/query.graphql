




query GetManga($id: Int!, $withFirstUnread: Boolean = true) {
  manga(id: $id) {
    ...MangaDto
    __typename
  }
}

mutation UpdateManga($input: UpdateMangaInput!, $withFirstUnread: Boolean = true) {
  updateManga(input: $input) {
    manga {
        ...MangaDto
    }
  }
}

mutation UpdateMangaCategories($updateCategoryInput: UpdateMangaCategoriesInput!) {
  updateMangaCategories(input: $updateCategoryInput) {
    manga {
      id
      categories {
        nodes {
          ...CategoryDto
        }
        totalCount
      }
    }
  }
}

mutation UpdateMangasCategories($input: UpdateMangasCategoriesInput!) {
  updateMangasCategories(input: $input) {
    mangas {
      id
    }
  }
}

mutation UpdateMangas($input: UpdateMangasInput!) {
  updateMangas(input: $input) {
    mangas {
      id
    }
  }
}

query GetChapter($id: Int!) {
  chapter(id: $id) {
    ...ChapterDto
  }
}

# A series' stored chapters, all of them: nodes only. `totalCount` and
# `pageInfo` would cost the server a COUNT and two sorted bound lookups on
# every call, for values nothing here reads.
query GetChapterPage($after: Cursor, $before: Cursor, $condition: ChapterConditionInput, $filter: ChapterFilterInput, $first: Int, $last: Int, $offset: Int, $order: [ChapterOrderInput!]) {
  chapters(
    after: $after
    before: $before
    condition: $condition
    filter: $filter
    first: $first
    last: $last
    offset: $offset
    order: $order
  ) {
    nodes {
      ...ChapterDto
    }
  }
}

mutation UpdateChapters($input: UpdateChaptersInput!) {
  updateChapters(input: $input) {
    chapters {
      ...ChapterDto
    }
  }
}
mutation UpdateChapter($input: UpdateChapterInput!) {
  updateChapter(input: $input) {
    chapter {
      ...ChapterDto
    }
  }
}

mutation DeleteDownloadedChapters($input: DeleteDownloadedChaptersInput!) {
  deleteDownloadedChapters(input: $input) {
    chapters {
      ...ChapterDto
    }
  }
}

mutation SetMangaMeta($input: SetMangaMetaInput!) {
  setMangaMeta(input: $input) {
    meta {
      ...MangaMetaDto
    }
  }
}

mutation DeleteMangaMeta($input: DeleteMangaMetaInput!) {
  deleteMangaMeta(input: $input) {
    __typename
  }
}

mutation GetChaptersByMangaId($input: FetchChaptersInput!) {
  fetchChapters(input:  $input) {
    chapters {
      ...ChapterDto
    }
  }
}

mutation GetMangaAndChaptersByMangaId($input: FetchMangaAndChaptersInput!) {
  fetchMangaAndChapters(input: $input) {
    chapters {
      ...ChapterDto
    }
  }
}

query GetMangaCategories($id: Int!) {
  manga(id: $id) {
    categories {
      nodes {
        ...CategoryDto
      }
    }
    __typename
  }
}

mutation GetChapterPages($input: FetchChapterPagesInput!) {
  fetchChapterPages(input: $input) {
    ...ChapterPagesDto
  }
}

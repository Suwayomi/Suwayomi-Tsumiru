query GetChapterWithMangaPage($after: Cursor, $before: Cursor, $condition: ChapterConditionInput, $filter: ChapterFilterInput, $first: Int, $last: Int, $offset: Int, $order: [ChapterOrderInput!]) {
  chapters(
    after: $after
    before: $before
    condition: $condition
    filter: $filter
    first: $first
    last: $last
    offset: $offset
    order: $order
  ) {
    ...ChapterPageWithMangaDto
  }
}


mutation UpdateLibraryMangas($input: UpdateLibraryMangaInput!) {
  updateLibraryManga(input: $input) {
    updateStatus {
      ...UpdateStatusBaseDto
    }
  }
}

mutation UpdateCategoryMangas($input: UpdateCategoryMangaInput!) {
  updateCategoryManga(input: $input) {
    updateStatus {
      ...UpdateStatusBaseDto
    }
  }
}

mutation StopCategoryUpdate($input: UpdateStopInput!) {
  updateStop(input: $input) {
    __typename
  }
}

# Library update progress: whether a run is going, and how far. The server
# keeps these counts in memory, so a status read or push costs it no query.
# The deprecated `updateStatus` instead resolved every series of every job
# list, one query per series and per series field (subscriptions don't batch
# data loaders), once a second for the whole run.
query UpdateProgress {
  libraryUpdateStatus {
    jobsInfo {
      ...UpdateProgressDto
    }
  }
}

query LastUpdateTimestamp {
  lastUpdateTimestamp {
    timestamp
  }
}

# The one live progress feed, shared by everything that follows a run. The
# per-series updates it can also carry aren't selected, so maxUpdates 0 keeps
# the server from even listing them.
subscription UpdateProgressChange {
  libraryUpdateStatusChanged(input: { maxUpdates: 0 }) {
    jobsInfo {
      ...UpdateProgressDto
    }
  }
}


# Failed series from the most recent run, off the server's current status API.
# The deprecated `updateStatus` job lists hang on a live server (n+1 in the
# server's data loaders), which is what made the old summary screen spin.
query LibraryUpdateFailures($withFirstUnread: Boolean = false) {
  libraryUpdateStatus {
    mangaUpdates {
      status
      manga {
        ...MangaDto
      }
    }
  }
}

# Statuses only: the error count on More and in the update menu doesn't need
# the series, and asking for them made the server resolve every series of the
# last run (~780 KB for 360 series) at every launch.
query LibraryUpdateFailureCount {
  libraryUpdateStatus {
    mangaUpdates {
      status
    }
  }
}

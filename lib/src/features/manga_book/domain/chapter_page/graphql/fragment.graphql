# Nodes only: the server computes `totalCount` (a COUNT) and `pageInfo` (two
# sorted bound lookups) over the whole filtered chapter set on every request,
# whatever the page size. The Updates feed pages by offset and learns whether
# another page follows from one extra row (UpdatesRepository).
fragment ChapterPageWithMangaDto on ChapterNodeList {
    nodes {
      ...ChapterWithMangaDto
    }
}

fragment ChapterPagesDto on FetchChapterPagesPayload {
    chapter {
      id
      pageCount
      __typename
    }
    pages
    __typename
}

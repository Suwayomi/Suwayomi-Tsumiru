

mutation UpdateExtension($id: String!, $install: Boolean = false, $uninstall: Boolean = false, $update: Boolean = false) {
  updateExtension(
    input: {id: $id, patch: {install: $install, uninstall: $uninstall, update: $update}}
  ) {
    clientMutationId
    extension {
      ...ExtensionDto
    }
  }
}

mutation InstallExternalExtension($extensionFile: Upload!) {
  installExternalExtension(input: {extensionFile: $extensionFile}) {
    clientMutationId
    extension {
      ...ExtensionDto
    }
  }
}

# Read-only count for the Browse nav badge. Deliberately NOT the fetchExtensions
# mutation the extensions screen uses: that sends the server out to the repos,
# and the nav shell is built on every launch.
query ExtensionUpdateCount {
  extensions(condition: {hasUpdate: true, isInstalled: true}) {
    totalCount
  }
}

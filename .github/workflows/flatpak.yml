# Build, GPG-sign and publish a self-hosted Flatpak repo to GitHub Pages.
#
# Flutter can't build inside flatpak-builder's sandbox, so this is two stages:
#   1. build-bundle  — `flutter build linux` on the host, upload as an artifact
#   2. flatpak       — in the freedesktop container, package the prebuilt bundle
#                      with flatpak-builder (via flatter), sign, and upload the
#                      OSTree repo as a Pages artifact
#   3. deploy        — publish the Pages artifact (-> suwayomi.github.io/Suwayomi-Tsumiru)
name: Flatpak

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flatpak-pages
  cancel-in-progress: false

jobs:
  build-bundle:
    name: Build Linux bundle (${{ matrix.app-id }})
    strategy:
      matrix:
        app-id: [io.github.aaronbamblett.tsumiru, app.tsumiru.Tsumiru]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Install Linux build deps
        run: |
          opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=25)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Inject MyAnimeList client id
        run: |
          sed -i "s|defaultValue: '',|defaultValue: '${{ secrets.MAL_CLIENT_ID }}',|" \
            lib/src/features/manga_book/data/recommendations/providers/myanimelist_provider.dart
      - name: Build Linux bundle
        env:
          APP_ID: ${{ matrix.app-id }}
        run: |
          if [ "$APP_ID" = "app.tsumiru.Tsumiru" ]; then
            export TSUMIRU_APPLICATION_ID="$APP_ID"
          fi
          flutter build linux --release
      - name: Stage bundle next to the manifest
        run: |
          mkdir -p flatpak/bundle
          cp -r build/linux/x64/release/bundle/. flatpak/bundle/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle-${{ matrix.app-id }}
          path: flatpak/bundle

  flatpak:
    name: Build & sign Flatpak
    needs: build-bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Restore prebuilt bundle into the manifest dir
        uses: actions/download-artifact@v7
        with:
          name: linux-bundle-io.github.aaronbamblett.tsumiru
          path: flatpak/bundle
      - name: Restore new-ID bundle into the manifest dir
        uses: actions/download-artifact@v7
        with:
          name: linux-bundle-app.tsumiru.Tsumiru
          path: flatpak/bundle-new
      - name: Import GPG signing key
        run: echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import
      - name: Stamp the app version into the AppStream metainfo
        # Backfill a missing entry from pubspec.yaml; the committed history is authoritative.
        run: tool/add_metainfo_release.sh
      - uses: andyholmes/flatter@v1.0.0
        with:
          files: |
            flatpak/io.github.aaronbamblett.tsumiru.yml
            flatpak/app.tsumiru.Tsumiru.yml
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          upload-pages-artifact: true
          upload-pages-includes: |
            flatpak/tsumiru-repo.gpg
            flatpak/io.github.aaronbamblett.tsumiru.flatpakref
            flatpak/app.tsumiru.Tsumiru.flatpakref
            flatpak/index.flatpakrepo

  deploy:
    name: Deploy Pages
    needs: flatpak
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: tsumiru
description: A manga reader client for Suwayomi Server.

publish_to: "none"
# Build number continues from 0.6.4+28 so Android upgrades stay monotonic.
version: 1.6.3+5004

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  app_links: ^7.2.1
  collection: ^1.19.0
  cached_network_image: ^3.2.2
  cached_network_image_platform_interface: ^4.0.0
  connectivity_plus: ^7.0.0
  connectivity_plus_linux_portal: ^0.0.4
  wakelock_plus: ^1.7.0
  diacritic: ^0.1.6
  drift: ^2.32.0
  ffi: ^2.2.0
  file: ^7.0.0
  file_picker: ^13.1.0
  flex_color_picker: 3.8.0
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  # Fork raises compileSdk to 34; upstream 1.0.1 targets 30 and fails the Android build.
  flutter_android_volume_keydown:
    git:
      url: https://github.com/DattatreyaReddy/flutter_android_volume_keydown
      ref: "9db2306fd2b4f804f5b9fbf69b97b211f47f527c"
  flutter_cache_manager: ^3.3.0
  flutter_foreground_task: ^11.0.1
  flutter_hooks: ^0.21.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  flutter_staggered_grid_view: ^0.7.0
  fluttertoast: ^10.0.0
  freezed_annotation: ^3.0.0
  gap: ^3.0.1
  go_router: ^17.0.0
  gql: ^1.0.1
  graphql: ^5.2.4
  hooks_riverpod: ^3.0.0
  http: ^1.2.0
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.5.0
  material_color_utilities: ^0.13.0
  network_info_plus: ^8.2.1
  package_info_plus: ^10.2.1
  path: ^1.8.3
  path_provider: ^2.0.11
  pub_semver: ^2.1.2
  queue: ^3.1.0+2
  riverpod_annotation: ^4.0.0
  # Fork exposes ScrollPosition; drop once google/flutter.widgets#535 lands.
  scrollable_positioned_list:
    git:
      url: https://github.com/yakagami/scrollable_positioned_list
      ref: "4641e83"
  shared_preferences: ^2.0.15
  sqlite3: ^3.0.0
  shimmer: ^4.0.0
  url_launcher: ^6.1.6
  screen_brightness: ^2.1.11
  share_plus: ^13.3.0
  gal: ^2.3.2
  image: ^4.8.0
  window_manager: ^0.5.2
  flutter_local_notifications: ^22.1.0
  workmanager: ^0.10.9
  battery_plus: ^7.1.1
  uuid: ^4.6.0
  pointycastle: ^4.0.0
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.14
  drift_dev: ^2.32.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.2.14
  flutter_riverpod: ^3.3.2
  flutter_test:
    sdk: flutter
  # 4.0.2+ needs analyzer 14, which graphql_codegen's gql_code_builder (<14) blocks.
  freezed: ^4.0.1
  # Keep aligned with the go_router runtime major (builder 4.x ↔ go_router 17.x).
  go_router_builder: ^4.0.0
  graphql_codegen: ^3.0.0
  json_serializable: ^6.5.4
  lints: ^6.1.0
  riverpod_generator: ^4.0.4
  unorm_dart: 0.3.3
  vector_math: ^2.4.2
  workmanager_android: ^0.10.8

  path_provider_platform_interface: ^2.1.3
flutter:
  uses-material-design: true
  generate: true
  # assets/icons/launcher/ holds build-time sources only and stays out of the bundle.
  assets:
    - assets/icons/
    - assets/licenses/
    - assets/fonts/inter/OFL.txt
  fonts:
    - family: FontAwesomeBrands
      fonts:
        - asset: assets/fonts/Font-Awesome-7-Brands-Regular-400.otf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0b0d1a"
  image: assets/icons/launcher/splash_icon.png
  android_12:
    color: "#0b0d1a"
    icon_background_color: "#0b0d1a"
    image: assets/icons/launcher/splash_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  adaptive_icon_background: "#02061D"
  adaptive_icon_foreground: "assets/icons/launcher/tsumiru_icon_fg.png"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/launcher/tsumiru_icon.png"
  image_path_ios: "assets/icons/launcher/tsumiru_icon.png"
  web:
    generate: true
    image_path: "assets/icons/launcher/tsumiru_icon.png"
    background_color: "#02061D"
    theme_color: "#7c7bff"
  windows:
    generate: true
    image_path: "assets/icons/launcher/tsumiru_icon_rounded.png"
  macos:
    generate: true
    image_path: "assets/icons/launcher/tsumiru_icon_rounded.png"
